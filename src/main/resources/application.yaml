spring:
  application:
    name: pulse

  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/pulsedb
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Hibernate 6+ 기본값(SqlTypes.ENUM)은 @Enumerated(STRING) 컬럼에 "값 목록 CHECK 제약"을 자동
        # 생성한다. ddl-auto:update는 이 제약을 enum이 바뀌어도 갱신하지 않아, enum에 값을 추가할 때마다
        # "violates check constraint ..._check" 에러가 재발한다. VARCHAR로 강제해 이 자동 생성 자체를 끈다
        # (모든 @Enumerated(STRING) 컬럼에 적용 — Task.status/priority, Notification.type,
        # RoleMenuPermission.menuKey, Channel.type, TaskActivity.field 전부 해당).
        type:
          preferred_enum_jdbc_type: VARCHAR
    hibernate:
      # 개발 단계 전용 — 운영 환경에서는 validate 등으로 반드시 교체할 것 (CLAUDE.md 참고)
      ddl-auto: update

  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
    time-zone: Asia/Seoul

pulse:
  jwt:
    # secret은 application-local.yaml(gitignore 대상)에서 주입 — 커밋 금지
    access-token-validity-seconds: 1800       # 30분
    refresh-token-validity-seconds: 1209600   # 14일, 로테이션 없음 (API-SPEC.md 1장)

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
