spring:
  application:
    name: pulse

  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/pulsedb
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      # 개발 단계 전용 — 운영 환경에서는 validate 등으로 반드시 교체할 것 (CLAUDE.md 참고)
      ddl-auto: update

  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
    time-zone: Asia/Seoul

pulse:
  jwt:
    # secret은 application-local.yaml(gitignore 대상)에서 주입 — 커밋 금지
    access-token-validity-seconds: 1800       # 30분
    refresh-token-validity-seconds: 1209600   # 14일, 로테이션 없음 (API-SPEC.md 1장)

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
